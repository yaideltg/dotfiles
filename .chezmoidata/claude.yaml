# Claude Code user settings (~/.claude/settings.json), merged key by key by dot_claude/modify_settings.json.
# Keys not listed here (anything Claude Code or I add locally) are left alone.
# To pre-approve tools, add a `permissions: {allow: [...]}` entry here; the list is replaced as a whole on apply.
claude:
  settings:
    env:
      DISABLE_AUTOUPDATER: "1"
    attribution:
      commit: ""
      pr: ""
    model: sonnet
    theme: dark
