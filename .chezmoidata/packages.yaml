packages:
  fedora:
    dnf:
      - firefox
      - emacs
      - calibre
      - gnucash
      - mpv
      # Font for Emacs
      - jetbrains-mono-fonts
      # cliamp decodes streams and converts downloads to mp3 through it
      - ffmpeg-free
      # Jinx (Emacs spell checker) compiles its native module against enchant
      - gcc
      - pkgconf-pkg-config
      - enchant2-devel
      - hunspell-en-US
      - hunspell-es-ES
      # LaTeX (basic TeX Live scheme)
      - texlive-scheme-basic
      # Flycheck LaTeX linters (tex-chktex is tried first, tex-lacheck as fallback)
      - texlive-chktex
      - texlive-lacheck
      # LaTeX packages by the TeX file they provide
      - tex(booktabs.sty)
      - tex(tikzfill.image.sty)
      - tex(listings.sty)
      - tex(tcolorbox.sty)
      - tex(listingsutf8.sty)
      - tex(capt-of.sty)
      - tex(titlesec.sty)
      # Development - Shell
      - tmux
      - fzf
      - ripgrep
      - bat
      - fd-find
      - zoxide
      - tealdeer
    # Installed only when the matching install_<tool> prompt was answered yes
    # (docker is configured in run_onchange_before_50-docker-setup)
    optional:
      docker:
        - moby-engine
        - docker-cli
        - docker-compose
        - docker-buildx
      apptainer:
        - apptainer
    flatpak:
      - com.bitwarden.desktop
      - md.obsidian.Obsidian
      - org.signal.Signal
    # rpm: not in Fedora repos; latest GitHub release asset named
    # <name>-<version>-Fedora-<release>-x86_64.rpm (falls back to the newest Fedora build published).
    # Installed once; update by removing the package and re-running apply.
    github_rpm:
      veracrypt: VeraCrypt/VeraCrypt
    # binary: install script URL (other CLI tools go in dot_config/mise/config.toml)
    curl:
      mise: https://mise.run
