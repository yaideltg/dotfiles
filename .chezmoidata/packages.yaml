packages:
  fedora:
    dnf:
      - firefox
      - emacs
      - calibre
      - gnucash
      # Jinx (Emacs spell checker) compiles its native module against enchant
      - gcc
      - pkgconf-pkg-config
      - enchant2-devel
      - hunspell-en-US
      - hunspell-es-ES
      # Development - Shell
      - tmux
      - fzf
      - ripgrep
      - bat
      - fd-find
      - zoxide
      - tealdeer
    flatpak:
      - com.bitwarden.desktop
      - md.obsidian.Obsidian
    # binary: install script URL (other CLI tools go in dot_config/mise/config.toml)
    curl:
      mise: https://mise.run
